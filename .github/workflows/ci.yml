name: Dashboard checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      sync-image: ${{ steps.upstream.outputs.image }}
      sync-revision: ${{ steps.upstream.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config --format json | jq -e '
            .services.dashboard |
            (has("build") | not) and
            (.image | startswith("ghcr.io/")) and
            .read_only and
            ([.volumes[].read_only] | all)
          '
      - name: Resolve upstream image and source revision
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/juaniwck/mister-retroarch-save-sync:latest
          docker pull "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Test against current upstream converters
        run: docker build --pull --build-arg SYNC_IMAGE=${{ steps.upstream.outputs.image }} --target test -t save-dashboard:test .
      - name: Build runtime image
        run: docker build --build-arg SYNC_IMAGE=${{ steps.upstream.outputs.image }} --target runtime -t save-dashboard:check .
      - name: Check hardened runtime and read-only mounts
        shell: bash
        run: |
          set -euo pipefail
          saves="$(mktemp -d)"
          mkdir -p "$saves/retroarch/Mesen" "$saves/retroarch/Snes9x" "$saves/retroarch/Genesis Plus GX"
          mkdir -p "$saves/mister/NES" "$saves/mister/SNES" "$saves/mister/Genesis" "$saves/mister/MegaDrive"
          printf 'dashboard smoke test' > "$saves/retroarch/Mesen/Example.srm"
          cp "$saves/retroarch/Mesen/Example.srm" "$saves/mister/NES/Example.sav"
          chmod -R a+rX "$saves"
          docker run -d --name dashboard-check --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,source=$saves/retroarch,target=/retroarch/saves,readonly" \
            --mount "type=bind,source=$saves/mister,target=/mister/saves,readonly" \
            save-dashboard:check
          trap 'docker logs dashboard-check; docker rm -f dashboard-check' EXIT
          for attempt in {1..30}; do
            if docker exec dashboard-check node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            sleep 1
          done
          docker exec dashboard-check node -e "
            const fs = require('node:fs');
            (async () => {
              const response = await fetch('http://127.0.0.1:8080/api/status');
              const state = await response.json();
              if (!response.ok || state.snapshot.summary.identical !== 1) throw Error('Comparison smoke test failed');
              for (const root of ['/retroarch/saves', '/mister/saves']) {
                try { fs.writeFileSync(root + '/must-not-write', 'test'); }
                catch (error) { if (error.code === 'EROFS' || error.code === 'EACCES') continue; throw error; }
                throw Error('Save mount is writable: ' + root);
              }
            })().catch(error => { console.error(error); process.exit(1); });
          "

  publish:
    if: github.repository == 'msmirle/mister-retroarch-save-sync-dashboard' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            SYNC_IMAGE=${{ needs.test-and-build.outputs.sync-image }}
          tags: |
            ghcr.io/msmirle/mister-retroarch-save-sync-dashboard:latest
            ghcr.io/msmirle/mister-retroarch-save-sync-dashboard:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.test-and-build.outputs.sync-image }}
            org.opencontainers.image.base.source=https://github.com/juaniwck/mister-retroarch-save-sync/tree/${{ needs.test-and-build.outputs.sync-revision }}

  verify-public-image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Pull both architectures without credentials
        env:
          IMAGE: ghcr.io/msmirle/mister-retroarch-save-sync-dashboard@${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          config="$(mktemp -d)"
          echo 'A new GHCR package must be set to Public once in its package settings.'
          docker --config "$config" pull --platform linux/amd64 "$IMAGE"
          docker --config "$config" pull --platform linux/arm64 "$IMAGE"
